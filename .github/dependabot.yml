version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    rebase-strategy: auto
    versioning-strategy: increase
    commit-message:
      prefix: deps(npm)
    groups:
      npm-tooling:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    rebase-strategy: auto
    commit-message:
      prefix: deps(go)
    groups:
      go-modules:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    rebase-strategy: auto
    commit-message:
      prefix: deps(actions)
    groups:
      github-actions:
        patterns:
          - "*"
